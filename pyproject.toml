[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "trustworthy-personal-knowledge-assistant"
version = "0.1.0"
description = "Evidence-aware personal knowledge assistant with auditable lineage."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.22,<1",
  "alembic>=1.18,<2",
  "fastapi==0.139.2",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
  "markdown-it-py>=4,<5",
  "openai>=2.49,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "pyyaml>=6,<7",
  "python-ulid>=3,<4",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "uvicorn==0.51.0",
]

[project.scripts]
trustworthy-kb-api = "trustworthy_kb.api.cli:main"
trustworthy-kb-eval = "trustworthy_kb.answer.eval_cli:main"
trustworthy-kb-governance = "trustworthy_kb.governance.cli:main"
trustworthy-kb-ingest = "trustworthy_kb.ingestion.cli:main"
trustworthy-kb-publication = "trustworthy_kb.publication.cli:main"

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=1.0,<2"]
dev = [
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-pyyaml>=6,<7",
]
ollama = ["langchain-ollama>=1.0,<2"]
retrieval = ["pymilvus==2.6.14"]
bge = ["FlagEmbedding>=1.3.5,<2"]
eval = [
  "langchain-community>=0.3.31,<0.4",
  "ragas==0.4.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trustworthy_kb"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires explicit external services and credentials",
]

[tool.coverage.run]
branch = true
source = ["trustworthy_kb"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["trustworthy_kb"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["trustworthy_kb"]
