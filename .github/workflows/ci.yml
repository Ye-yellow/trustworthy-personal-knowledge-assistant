name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.9"
          python-version: "3.12"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --extra dev

      - name: Check public repository privacy
        run: uv run python scripts/check_public_repository.py

      - name: Lint and check formatting
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Smoke test database migration
        run: uv run alembic upgrade head
        env:
          TRUSTKB_DATABASE_URL: sqlite+aiosqlite:///./ci-control-plane.db

      - name: Run offline tests with coverage
        run: uv run pytest -m "not integration" --cov=trustworthy_kb --cov-report=term-missing

      - name: Enforce deterministic trusted-answer quality gate
        run: uv run trustworthy-kb-eval deterministic

      - name: Build package
        run: uv build
